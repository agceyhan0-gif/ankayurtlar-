<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Muanka Veresiye</title>
<style>
:root{--w:1060px;--green:#1f7a37;--dark:#0e6130;--red:#b3272e;--border:#d9ded9;--bg:#eef0ee}
*{box-sizing:border-box;font-family:Arial,Helvetica,sans-serif}
body{margin:0;background:var(--bg);color:#222;text-transform:uppercase}
button,input,select,textarea{font:inherit}button{cursor:pointer}
.app{width:var(--w);max-width:100%;margin:auto;background:#f7f8f7;border:1px solid var(--border)}
.toolbar{min-height:56px;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:7px 8px;background:var(--dark)}
.toolbar button{min-height:38px;padding:6px 10px;border:0;border-radius:6px;background:#2a8a48;color:#fff;font-size:11px;font-weight:bold}
.toolbar button.active{background:#fff;color:var(--green)}
.clock{margin-left:auto;color:#fff;font-size:12px;font-weight:bold;white-space:nowrap}
.content{display:grid;grid-template-columns:minmax(0,1fr) 178px;gap:8px;padding:8px;align-items:start}
.main{min-width:0}.filter{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
input,select,textarea{min-width:0;padding:9px;border:1px solid #d2d7d2;border-radius:6px;background:#fff;font-size:12px}
.filter input{flex:1}.filter select{max-width:155px}
.filter input[type="date"]{flex:0 0 135px;max-width:135px;padding:7px}
.filter.hareket{flex-wrap:nowrap}
.filter.hareket input[type="date"]{flex:0 0 122px;max-width:122px;min-width:0;padding:7px 6px}
#moveCariFilter{flex:0 0 96px;max-width:96px;min-width:0}
#moveAciklamaFilter{flex:0 0 96px;max-width:96px;min-width:0}
.filter.hareket select{flex:0 0 128px;max-width:128px;min-width:0;padding:7px 6px}
.list{height:282px;overflow:auto;border:1px solid var(--border);border-radius:8px;background:#fff}
table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:12px}
th{position:sticky;top:0;background:#f1f3f1;text-align:left;font-size:11px}
th,td{height:34px;padding:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
td{border-top:1px solid #eee}tbody tr{cursor:pointer}tbody tr.empty{cursor:default}tr.selected{background:#dff0df}
td.numeric,th.numeric{text-align:right}
.bottom{margin-top:8px;padding:9px;border:1px solid var(--border);border-radius:8px;background:#fff}
.bottom-title{margin-bottom:8px;padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:#f1f3f1;font-size:13px;font-weight:bold}
.tabs{display:flex;margin-bottom:8px;border-bottom:1px solid var(--border)}
.tabs button{padding:8px 16px;border:1px solid var(--border);border-bottom:0;background:#f3f3f3;font-size:11px;font-weight:bold}
.tabs button.active{background:#fff;color:var(--green)}
.panel{height:202px;overflow:auto}
.info-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.info{min-height:60px;padding:10px 12px;border:1px solid #dfe4df;border-radius:9px;background:#fbfdfb;overflow:hidden}
.info span{display:block;margin-bottom:4px;color:#75816f;font-size:10px;font-weight:bold}
.info b{font-size:13px;font-weight:600;overflow-wrap:anywhere}
.move-box{height:202px;overflow:auto;border:1px solid var(--border);border-radius:8px;background:#fff}
.note{width:100%;height:190px;resize:none}
.actions{width:178px;display:flex;flex-direction:column;gap:5px;padding-top:42px;align-items:flex-end;overflow:visible}
.actions button{width:158px;flex:0 0 auto;min-height:36px;padding:7px 6px;border:0;border-radius:8px;color:#fff;font-size:11px;font-weight:bold;line-height:1.15;text-align:center;white-space:normal;word-break:break-word}
.green{background:var(--green)}.red{background:var(--red)}
.modal{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;padding:12px;background:#0007}
.modal-box{width:760px;max-width:96vw;max-height:94vh;overflow:auto;padding:18px;border-radius:10px;background:#fff}
.modal-box h2{margin:0 0 14px;font-size:17px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form-grid label,.form-label{display:flex;flex-direction:column;gap:5px;font-size:11px;font-weight:bold}
.form-grid .wide{grid-column:span 2}
.form-buttons{display:flex;gap:8px;margin-top:12px}
.form-buttons button{padding:11px 14px;border:0;border-radius:7px;font-weight:bold}
.cancel{width:100px;background:#e9e9e9}.save{flex:1;background:var(--green);color:#fff}
.choice{display:flex;gap:7px;margin:8px 0}.choice button{flex:1;padding:9px;border:1px solid #aaa;border-radius:6px;background:#f5f5f5;font-weight:bold}
.choice button.active{background:var(--dark);color:#fff}
#printArea{display:none}
@media print{body{background:#fff}.app,.modal{display:none!important}#printArea{display:block!important;padding:10px}#printArea th,#printArea td{position:static;border:1px solid #999;white-space:normal}}
</style>
</head>
<body>

<nav class="toolbar" id="toolbar"></nav>
<div class="content">
<main class="main">
<div class="filter" id="filters"></div>
<div class="list"><table><thead id="thead"></thead><tbody id="tbody"></tbody></table></div>

</section>
</main>
<aside class="actions" id="actions"></aside>
</div>
</div>
<div id="printArea"></div>
<div class="modal" id="modal"><div class="modal-box"><h2 id="modalTitle"></h2><div id="modalContent"></div></div></div>
<script>
"use strict";
let moduleName="cari",activeModule=false,selectedCari=null,selectedMove=null,selectedStock=null,selectedCash=null,selectedBank=null,modalMode="",direction="B",cashOpeningDirection="B",bankOpeningDirection="B";

let hareketler=[{id:1,kod:"00011",tarih:"04.11.2026",islem:"SATIŞ FATURASI",aciklama:"",yon:"B",tutar:15000},{id:2,kod:"00011",tarih:"04.11.2026",islem:"NAKİT TAHSİLAT",aciklama:"",yon:"A",tutar:5000},{id:3,kod:"00012",tarih:"04.11.2026",islem:"ALIŞ FATURASI",aciklama:"",yon:"B",tutar:200100}];

let kasalar=[{kod:"KAS00001",ad:"MERKEZ KASA",cariTuru:"",bakiye:0},{kod:"KAS00002",ad:"SATIŞ KASASI",cariTuru:"",bakiye:0},{kod:"KAS00003",ad:"ŞUBE KASASI",cariTuru:"",bakiye:0},{kod:"KAS00004",ad:"TL KASASI",cariTuru:"",bakiye:0},{kod:"KAS00005",ad:"YEDEK KASA",cariTuru:"",bakiye:0}];

let bankaHareketleri=[];
const MODULES=[["cari","CARİ HESAPLAR"],["kasa","KASALAR"],["banka","BANKALAR"],["cek","ÇEK/SENET"],["hareket","HAREKETLER"],["kullanici","KULLANICI"]];
function money(n){return Number(n||0).toLocaleString("tr-TR",{minimumFractionDigits:2,maximumFractionDigits:2})+" TL"}
function moneyRead(v){let s=String(v??"").replace(/TL/gi,"").replace(/\s/g,"");if(!s)return NaN;s=s.replace(/\./g,"").replace(",",".");let n=Number(s);return Number.isFinite(n)?n:NaN}
function dateText(v){if(!v)return "06.11.2026";let p=v.split("-");return `${p[2]}.${p[1]}.${p[0]}`}
function dateOrder(v){let p=String(v||"").split(".");return p.length===3?Number(p[2])*10000+Number(p[1])*100+Number(p[0]):0}
function nowTime(){let d=new Date(),z=n=>String(n).padStart(2,"0");return `${z(d.getDate())}.${z(d.getMonth()+1)}.${d.getFullYear()} ${z(d.getHours())}:${z(d.getMinutes())}:${z(d.getSeconds())}`}
function nextCari(){let n=0;cariler.forEach(c=>n=Math.max(n,parseInt(c.kod,10)||0));return String(n+1).padStart(5,"0")}
function nextStock(){let n=0;stoklar.forEach(s=>n=Math.max(n,parseInt(s.kod.replace(/\D/g,""),10)||0));return "STK"+String(n+1).padStart(5,"0")}
function nextCash(){let n=0;kasalar.forEach(k=>n=Math.max(n,parseInt(k.kod.replace(/\D/g,""),10)||0));return "KAS"+String(n+1).padStart(5,"0")}
function nextBank(){let n=0;bankalar.forEach(k=>n=Math.max(n,parseInt(k.kod.replace(/\D/g,""),10)||0));return "BNK"+String(n+1).padStart(5,"0")}
function balance(code){return hareketler.filter(h=>h.kod===code).reduce((s,h)=>s+(h.yon==="B"?Number(h.tutar):-Number(h.tutar)),0)}
function button(l,c,f){return `<button class="${c}" onclick="${f}">${l}</button>`}
function showModal(t,h,m){modalMode=m;document.getElementById("modalTitle").textContent=t;document.getElementById("modalContent").innerHTML=h;document.getElementById("modal").style.display="flex"}
function closeModal(){document.getElementById("modal").style.display="none"}
function resetTabs(){document.getElementById("tabs").innerHTML=`<button class="active" onclick="showTab('info',this)">BİLGİLER</button><button onclick="showTab('moves',this)">HAREKETLER</button><button onclick="showTab('notes',this)">NOTLAR</button><button onclick="showTab('deposit',this)">DEPOZİTO</button>`}
function drawToolbar(){const b=document.getElementById("toolbar");b.innerHTML="";MODULES.forEach(([id,l])=>{const x=document.createElement("button");x.textContent=l;if(id===moduleName&&activeModule)x.classList.add("active");x.onclick=()=>{moduleName=id;activeModule=true;draw()};b.appendChild(x)});const c=document.createElement("span");c.className="clock";c.textContent=nowTime();b.appendChild(c);if(!window.clockTimer)window.clockTimer=setInterval(()=>{const e=document.querySelector(".clock");if(e)e.textContent=nowTime()},1000)}
function draw(){selectedMove=null;drawToolbar();const f=document.getElementById("filters"),hd=document.getElementById("thead"),bd=document.getElementById("tbody"),ac=document.getElementById("actions");document.getElementById("bottomSec").style.display="";document.getElementById("generalDetail").style.display="none";["info","moves","notes","deposit"].forEach(x=>document.getElementById("tab-"+x).style.display="none");ac.style.display="";f.style.display="flex";f.classList.remove("hareket");document.querySelector(".list").style.height="";document.querySelector("#tab-info").style.height="";
if(moduleName==="cari"){resetTabs();document.getElementById("detailTitle").textContent="CARİ SEÇİLMEDİ";document.getElementById("tabs").style.display="flex";document.getElementById("tab-info").style.display="block";f.innerHTML=`<input id="searchCari" placeholder="CARİ KODU VEYA ÜNVAN İLE ARA" oninput="drawCari()"><select id="typeFilter" onchange="drawCari()"><option value="">TÜM TÜRLER</option><option>MÜŞTERİ</option><option>TEDARİKÇİ</option><option>ANKA</option></select><select id="statusFilter" onchange="drawCari()"><option>AKTİF</option><option>PASİF</option></select><select id="balanceFilter" onchange="drawCari()"><option value="">TÜM BAKİYELER</option><option value="B">BORÇLU</option><option value="A">ALACAKLI</option></select>`;hd.innerHTML="<tr><th>CARİ KOD</th><th>CARİ ÜNVAN</th><th>TÜR</th><th>SON İŞLEM</th><th class='numeric'>BAKİYE</th></tr>";ac.innerHTML=button("YAZDIR","green","printCaris()")+button("EKSTRE ÖNİZLE","green","printStatement()")+button("CARİ HESAP EKLE","green","openCari()")+button("CARİ DEĞİŞTİR","green","editCari()")+button("CARİ SİL","green","deleteCari()")+button("BORÇ / ALACAK DEKONTU","green","openJournal()")+button("CARİ NAKİT İŞLEMLERİ","red","openCashMove()")+button("BANKA İŞLEMLERİ","red","openBankMove()")+button("DEPOZİTO EKLE","green","openDepozito('ekle')")+button("DEPOZİTO ÖDE","red","openDepozito('ode')")+button("DEPOZİTO DEĞİŞTİR","red","editDepozito()")+button("HAREKET DEĞİŞTİR","red","editMove()")+button("HAREKET SİL","red","deleteMove()");drawCari();return}
if(moduleName==="kasa"){f.style.display="flex";f.innerHTML=`<input id="cashSearch" placeholder="KASA KODU VEYA ADI İLE ARA" oninput="drawCash()"><select id="cashTurFilter" onchange="drawCash()"><option value="">TÜM TÜRLER</option><option>MÜŞTERİ</option><option>TEDARİKÇİ</option><option>ANKA</option></select><select id="cashBakiyeFilter" onchange="drawCash()"><option value="">TÜM BAKİYELER</option><option value="B">BORÇLU</option><option value="A">ALACAKLI</option></select>`;hd.innerHTML="<tr><th>KASA KODU</th><th>KASA ADI</th><th>CARİ TÜR</th><th class='numeric'>BAKİYE</th></tr>";document.getElementById("detailTitle").textContent="KASADA YAPILAN HAREKETLER";document.getElementById("tabs").innerHTML=`<button class="active">KASADA YAPILAN HAREKETLER</button>`;document.getElementById("tabs").style.display="flex";document.getElementById("tab-info").style.display="block";document.querySelector(".list").style.height="212px";document.querySelector("#tab-info").style.height="276px";ac.innerHTML=button("KASA EKLE","green","openCash()")+button("KASA DEĞİŞTİR","green","editCash()")+button("KASA SİL","red","deleteCash()")+button("KASALAR ARASI VİRMAN","green","openCashTransfer()")+button("KASA / BANKA VİRMAN","green","openCashBankTransfer('kasa')")+button("YAZDIR","green","printSimple('KASALAR')");drawCash();return}
if(moduleName==="banka"){f.style.display="flex";f.innerHTML=`<input id="bankSearch" placeholder="BANKA KODU VEYA ADI İLE ARA" oninput="drawBank()"><select id="bankTurFilter" onchange="drawBank()"><option value="">TÜM TÜRLER</option><option>MÜŞTERİ</option><option>TEDARİKÇİ</option><option>ANKA</option></select><select id="bankBakiyeFilter" onchange="drawBank()"><option value="">TÜM BAKİYELER</option><option value="B">BORÇLU</option><option value="A">ALACAKLI</option></select>`;hd.innerHTML="<tr><th>BANKA KODU</th><th>BANKA ADI</th><th>CARİ TÜR</th><th class='numeric'>BAKİYE</th></tr>";document.getElementById("detailTitle").textContent="BANKADA YAPILAN HAREKETLER";document.getElementById("tabs").innerHTML=`<button class="active">BANKADA YAPILAN HAREKETLER</button>`;document.getElementById("tabs").style.display="flex";document.getElementById("tab-info").style.display="block";document.querySelector(".list").style.height="212px";document.querySelector("#tab-info").style.height="276px";ac.innerHTML=button("BANKA EKLE","green","openBank()")+button("BANKA DEĞİŞTİR","green","editBank()")+button("BANKA SİL","red","deleteBank()")+button("BANKALAR ARASI VİRMAN","green","openBankTransfer()")+button("KASA / BANKA VİRMAN","green","openCashBankTransfer('banka')")+button("YAZDIR","green","printSimple('BANKALAR')");drawBank();return}
if(moduleName==="hareket"){f.classList.add("hareket");f.innerHTML=`<input id="moveCariFilter" placeholder="CARİ KODU" oninput="drawGeneralMoves()"><input id="moveAciklamaFilter" placeholder="AÇIKLAMA" oninput="drawGeneralMoves()"><input type="date" id="moveDateStart" onchange="drawGeneralMoves()" title="BAŞLANGIÇ"><input type="date" id="moveDateEnd" onchange="drawGeneralMoves()" title="BİTİŞ"><select id="moveIslemFilter" onchange="drawGeneralMoves()"><option value="">TÜM İŞLEMLER</option><option>SATIŞ FATURASI</option><option>ALIŞ FATURASI</option><option>NAKİT TAHSİLAT</option><option>NAKİT ÖDEME</option><option>GELEN HAVALE</option><option>GİDEN HAVALE</option><option>BANKA MASRAFI</option><option>BORÇ DEKONTU</option><option>ALACAK DEKONTU</option><option>DEPOZİTO ALMA</option><option>DEPOZİTO ÖDEME</option><option>VİRMAN GİRİŞ</option><option>VİRMAN ÇIKIŞ</option></select><select id="moveYonFilter" onchange="drawGeneralMoves()"><option value="">BORÇ + ALACAK</option><option value="B">BORÇ</option><option value="A">ALACAK</option></select>`;hd.innerHTML="<tr><th style='width:85px'>TARİH</th><th style='width:150px'>CARİ</th><th style='width:150px'>İŞLEM</th><th>AÇIKLAMA</th><th class='numeric' style='width:130px'>TUTAR</th></tr>";document.getElementById("bottomSec").style.display="none";ac.style.display="none";ac.innerHTML="";drawGeneralMoves();return}
f.innerHTML=`<input id="genSearch" placeholder="ARA" oninput="genFiltre()">`;hd.innerHTML="<tr><th>KOD</th><th>AÇIKLAMA</th><th>TÜR</th><th>TARİH</th><th class='numeric'>TUTAR</th></tr>";document.getElementById("detailTitle").textContent=moduleName==="cek"?"ÇEK/SENET":"KULLANICI";document.getElementById("generalDetail").style.display="block";document.getElementById("generalDetail").textContent=moduleName==="cek"?"ÇEK / SENET KAYITLARI":"KULLANICI KAYITLARI";ac.innerHTML=button("YAZDIR","green","printSimple('KAYITLAR')");bd.innerHTML=Array.from({length:7},()=>'<tr class="empty"><td>&nbsp;</td><td></td><td></td><td></td><td></td></tr>').join("")}
function genFiltre(){}
function drawCari(){const q=(document.getElementById("searchCari")?.value||"").toLocaleLowerCase("tr"),t=document.getElementById("typeFilter")?.value||"",s=document.getElementById("statusFilter")?.value||"AKTİF",bf=document.getElementById("balanceFilter")?.value||"";const L=cariler.filter(c=>(!q||(c.kod+" "+c.unvan).toLocaleLowerCase("tr").includes(q))&&(!t||c.tip===t)&&c.durum===s&&(!bf||(bf==="B"&&balance(c.kod)>0)||(bf==="A"&&balance(c.kod)<0)));const bd=document.getElementById("tbody");bd.innerHTML="";L.forEach(c=>{const tr=document.createElement("tr");if(selectedCari===c.kod)tr.classList.add("selected");const last=hareketler.filter(h=>h.kod===c.kod).sort((a,b)=>dateOrder(b.tarih)-dateOrder(a.tarih))[0];tr.innerHTML=`<td>${c.kod}</td><td>${c.unvan}</td><td>${c.tip}</td><td>${last?last.tarih:"—"}</td><td class="numeric">${money(balance(c.kod))}</td>`;tr.onclick=()=>{selectedCari=c.kod;drawCari();drawInfo();drawCariMoves();cizNot()};bd.appendChild(tr)});while(bd.children.length<7)bd.insertAdjacentHTML("beforeend",'<tr class="empty"><td>&nbsp;</td><td></td><td></td><td></td><td></td></tr>');drawInfo();drawCariMoves();cizNot()}

function setCashOpeningDirection(v){cashOpeningDirection=v;document.getElementById("openingDebit").classList.toggle("active",v==="B");document.getElementById("openingCredit").classList.toggle("active",v==="A")}
function editCash(){const k=kasalar.find(x=>x.kod===selectedCash);if(!k){alert("ÖNCE KASA SEÇİN.");return}showModal("KASA DEĞİŞTİR",`<div class="form-grid"><label>KASA KODU<input value="${k.kod}" disabled></label><label>KASA ADI *<input id="cashName" value="${k.ad}"></label></div><div class="form-buttons"><button class="cancel" onclick="closeModal()">İPTAL</button><button class="save" onclick="saveCash()">KAYDET</button></div>`,"cashEdit")}
function saveCash(){const ad=document.getElementById("cashName").value.trim();if(!ad){alert("KASA ADI GİRİN.");return}if(modalMode==="cashAdd"){const kod=document.getElementById("cashCode").value.trim().toLocaleUpperCase("tr-TR")||nextCash(),ct=document.getElementById("cashCariType").value,raw=document.getElementById("cashOpeningBalance").value.trim(),ac=raw?moneyRead(raw):0;if(!ct){alert("CARİ TÜR SEÇİN.");return}if(!Number.isFinite(ac)||ac<0){alert("GEÇERLİ AÇILIŞ BAKİYESİ GİRİN.");return}if(kasalar.some(k=>k.kod===kod)){alert("BU KASA KODU KULLANILIYOR.");return}kasalar.push({kod,ad,cariTuru:ct,bakiye:cashOpeningDirection==="B"?ac:-ac});selectedCash=kod;if(ac>0)kasaHareketleri.push({id:cashMoveId++,kasaKod:kod,tarih:"06.11.2026",islem:"AÇILIŞ BAKİYESİ",aciklama:"KASA AÇILIŞI",yon:cashOpeningDirection,tutar:ac})}else{const k=kasalar.find(x=>x.kod===selectedCash);if(k)k.ad=ad}closeModal();draw()}
function deleteCash(){if(!selectedCash){alert("ÖNCE KASA SEÇİN.");return}if(kasaHareketleri.some(h=>h.kasaKod===selectedCash)){alert("HAREKETİ OLAN KASA SİLİNEMEZ.");return}if(!confirm("SEÇİLİ KASA SİLİNSİN Mİ?"))return;kasalar=kasalar.filter(k=>k.kod!==selectedCash);kasaHareketleri=kasaHareketleri.filter(h=>h.kasaKod!==selectedCash);selectedCash=null;draw()}
function openCashTransfer(){if(kasalar.length<2){alert("EN AZ 2 KASA GEREKİR.");return}if(!selectedCash){alert("ÖNCE KASA SEÇİN.");return}showModal("KASALAR ARASI VİRMAN",`<div class="form-grid"><label class="wide">KAYNAK KASA<select id="cashFrom">${kasalar.map(k=>`<option value="${k.kod}" ${k.kod===selectedCash?"selected":""}>${k.kod} - ${k.ad}</option>`).join("")}</select></label><label class="wide">HEDEF KASA<select id="cashTo"><option value="">SEÇİNİZ</option>${kasalar.filter(k=>k.kod!==selectedCash).map(k=>`<option value="${k.kod}">${k.kod} - ${k.ad}</option>`).join("")}</select></label><label>TARİH<input id="cashTransferDate" type="date" value="2026-11-06"></label><label>TUTAR<input id="cashTransferAmount" placeholder="0,00 TL"></label><label class="wide">AÇIKLAMA<input id="cashTransferNote"></label></div><div class="form-buttons"><button class="cancel" onclick="closeModal()">İPTAL</button><button class="save" onclick="saveCashTransfer()">KAYDET</button></div>`,"cashTransfer")}
function saveCashTransfer(){const f=document.getElementById("cashFrom").value,t=document.getElementById("cashTo").value,a=moneyRead(document.getElementById("cashTransferAmount").value);if(!t){alert("HEDEF KASA SEÇİN.");return}if(f===t){alert("KAYNAK VE HEDEF AYNI OLAMAZ.");return}if(!Number.isFinite(a)||a<=0){alert("GEÇERLİ TUTAR GİRİN.");return}const fk=kasalar.find(k=>k.kod===f),tk=kasalar.find(k=>k.kod===t);if((Number(fk.bakiye)||0)<a){alert("KAYNAK KASADA YETERLİ BAKİYE YOK.");return}const th=dateText(document.getElementById("cashTransferDate").value),ac=document.getElementById("cashTransferNote").value.trim();fk.bakiye-=a;tk.bakiye+=a;kasaHareketleri.push({id:cashMoveId++,kasaKod:f,tarih:th,islem:"VİRMAN ÇIKIŞ",aciklama:ac||("→ "+tk.ad),yon:"A",tutar:a});kasaHareketleri.push({id:cashMoveId++,kasaKod:t,tarih:th,islem:"VİRMAN GİRİŞ",aciklama:ac||(fk.ad+" →"),yon:"B",tutar:a});closeModal();draw()}
function openBank(){bankOpeningDirection="B";showModal("BANKA EKLE",`<div class="form-grid"><label>BANKA KODU<input id="bankCode" placeholder="BOŞ BIRAKILIRSA OTOMATİK"></label><label>BANKA ADI *<input id="bankName"></label><label class="wide">CARİ TÜR<select id="bankCariType"><option value="">SEÇİNİZ</option><option>MÜŞTERİ</option><option>TEDARİKÇİ</option><option>ANKA</option></select></label><label class="wide">AÇILIŞ BAKİYESİ<input id="bankOpeningBalance" placeholder="0,00 TL"></label></div><div class="choice"><button type="button" id="bankOpeningDebit" class="active" onclick="setBankOpeningDirection('B')">BORÇLU</button><button type="button" id="bankOpeningCredit" onclick="setBankOpeningDirection('A')">ALACAKLI</button></div><div class="form-buttons"><button class="cancel" onclick="closeModal()">İPTAL</button><button class="save" onclick="saveBank()">KAYDET</button></div>`,"bankAdd")}
function setBankOpeningDirection(v){bankOpeningDirection=v;document.getElementById("bankOpeningDebit").classList.toggle("active",v==="B");document.getElementById("bankOpeningCredit").classList.toggle("active",v==="A")}
function editBank(){const k=bankalar.find(x=>x.kod===selectedBank);if(!k){alert("ÖNCE BANKA SEÇİN.");return}showModal("BANKA DEĞİŞTİR",`<div class="form-grid"><label>BANKA KODU<input value="${k.kod}" disabled></label><label>BANKA ADI *<input id="bankName" value="${k.ad}"></label></div><div class="form-buttons"><button class="cancel" onclick="closeModal()">İPTAL</button><button class="save" onclick="saveBank()">KAYDET</button></div>`,"bankEdit")}
function saveBank(){const ad=document.getElementById("bankName").value.trim();if(!ad){alert("BANKA ADI GİRİN.");return}if(modalMode==="bankAdd"){const kod=document.getElementById("bankCode").value.trim().toLocaleUpperCase("tr-TR")||nextBank(),ct=document.getElementById("bankCariType").value,raw=document.getElementById("bankOpeningBalance").value.trim(),ac=raw?moneyRead(raw):0;if(!ct){alert("CARİ TÜR SEÇİN.");return}if(!Number.isFinite(ac)||ac<0){alert("GEÇERLİ BAKİYE GİRİN.");return}if(bankalar.some(k=>k.kod===kod)){alert("BU BANKA KODU KULLANILIYOR.");return}bankalar.push({kod,ad,cariTuru:ct,bakiye:bankOpeningDirection==="B"?ac:-ac});selectedBank=kod;if(ac>0)bankaHareketleri.push({id:bankMoveId++,bankaKod:kod,tarih:"06.11.2026",islem:"AÇILIŞ BAKİYESİ",aciklama:"BANKA AÇILIŞI",yon:bankOpeningDirection,tutar:ac})}else{const k=bankalar.find(x=>x.kod===selectedBank);if(k)k.ad=ad}closeModal();draw()}
function deleteBank(){if(!selectedBank){alert("ÖNCE BANKA SEÇİN.");return}if(bankaHareketleri.some(h=>h.bankaKod===selectedBank)){alert("HAREKETİ OLAN BANKA SİLİNEMEZ.");return}if(!confirm("SEÇİLİ BANKA SİLİNSİN Mİ?"))return;bankalar=bankalar.filter(k=>k.kod!==selectedBank);bankaHareketleri=bankaHareketleri.filter(h=>h.bankaKod!==selectedBank);selectedBank=null;draw()}
function openBankTransfer(){if(bankalar.length<2){alert("EN AZ 2 BANKA GEREKİR.");return}if(!selectedBank){alert("ÖNCE BANKA SEÇİN.");return}showModal("BANKALAR ARASI VİRMAN",`<div class="form-grid"><label class="wide">KAYNAK BANKA<select id="bankFrom">${bankalar.map(k=>`<option value="${k.kod}" ${k.kod===selectedBank?"selected":""}>${k.kod} - ${k.ad}</option>`).join("")}</select></label><label class="wide">HEDEF BANKA<select id="bankTo"><option value="">SEÇİNİZ</option>${bankalar.filter(k=>k.kod!==selectedBank).map(k=>`<option value="${k.kod}">${k.kod} - ${k.ad}</option>`).join("")}</select></label><label>TARİH<input id="bankTransferDate" type="date" value="2026-11-06"></label><label>TUTAR<input id="bankTransferAmount" placeholder="0,00 TL"></label><label class="wide">AÇIKLAMA<input id="bankTransferNote"></label></div><div class="form-buttons"><button class="cancel" onclick="closeModal()">İPTAL</button><button class="save" onclick="saveBankTransfer()">KAYDET</button></div>`,"bankTransfer")}
function saveBankTransfer(){const f=document.getElementById("bankFrom").value,t=document.getElementById("bankTo").value,a=moneyRead(document.getElementById("bankTransferAmount").value);if(!t){alert("HEDEF BANKA SEÇİN.");return}if(f===t){alert("KAYNAK VE HEDEF AYNI OLAMAZ.");return}if(!Number.isFinite(a)||a<=0){alert("GEÇERLİ TUTAR GİRİN.");return}const fk=bankalar.find(k=>k.kod===f),tk=bankalar.find(k=>k.kod===t);if((Number(fk.bakiye)||0)<a){alert("KAYNAK BANKADA YETERLİ BAKİYE YOK.");return}const th=dateText(document.getElementById("bankTransferDate").value),ac=document.getElementById("bankTransferNote").value.trim();fk.bakiye-=a;tk.bakiye+=a;bankaHareketleri.push({id:bankMoveId++,bankaKod:f,tarih:th,islem:"VİRMAN ÇIKIŞ",aciklama:ac||("→ "+tk.ad),yon:"A",tutar:a});bankaHareketleri.push({id:bankMoveId++,bankaKod:t,tarih:th,islem:"VİRMAN GİRİŞ",aciklama:ac||(fk.ad+" →"),yon:"B",tutar:a});closeModal();draw()}
function kasaBankaBul(kod){const k=kasalar.find(x=>x.kod===kod);if(k)return{tip:"kasa",kayit:k,ad:k.ad};const b=bankalar.find(x=>x.kod===kod);if(b)return{tip:"banka",kayit:b,ad:b.ad};return null}
function cbSecenek(s){return `<optgroup label="KASALAR">${kasalar.map(k=>`<option value="${k.kod}" ${k.kod===s?"selected":""}>${k.kod} - ${k.ad}</option>`).join("")}</optgroup><optgroup label="BANKALAR">${bankalar.map(k=>`<option value="${k.kod}" ${k.kod===s?"selected":""}>${k.kod} - ${k.ad}</option>`).join("")}</optgroup>`}
function cbKaynakTip(kod){if(kasalar.some(k=>k.kod===kod))return "kasa";if(bankalar.some(k=>k.kod===kod))return "banka";return ""}
function cbHedefGuncelle(){const f=document.getElementById("cbFrom")?.value||"",t=document.getElementById("cbTo");if(!t)return;const tip=cbKaynakTip(f),o=t.value;let h='<option value="">SEÇİNİZ</option>';if(tip==="kasa")h+=`<optgroup label="BANKALAR">${bankalar.map(k=>`<option value="${k.kod}">${k.kod} - ${k.ad}</option>`).join("")}</optgroup>`;else if(tip==="banka")h+=`<optgroup label="KASALAR">${kasalar.map(k=>`<option value="${k.kod}">${k.kod} - ${k.ad}</option>`).join("")}</optgroup>`;else h+=cbSecenek("");t.innerHTML=h;if([...t.options].some(x=>x.value===o))t.value=o}
function openCashBankTransfer(n){if(!kasalar.length||!bankalar.length){alert("EN AZ 1 KASA VE 1 BANKA GEREKİR.");return}let v="";if(n==="kasa"&&selectedCash)v=selectedCash;if(n==="banka"&&selectedBank)v=selectedBank;showModal("KASA / BANKA VİRMAN",`<div class="form-grid"><label class="wide">KAYNAK (KASA / BANKA)<select id="cbFrom" onchange="cbHedefGuncelle()">${cbSecenek(v)}</select></label><label class="wide">HEDEF (KASA / BANKA)<select id="cbTo"><option value="">SEÇİNİZ</option></select></label><label>TARİH<input id="cbDate" type="date" value="2026-11-06"></label><label>TUTAR<input id="cbAmount" placeholder="0,00 TL"></label><label class="wide">AÇIKLAMA<input id="cbNote"></label></div><div class="form-buttons"><button class="cancel" onclick="closeModal()">İPTAL</button><button class="save" onclick="saveCashBankTransfer()">KAYDET</button></div>`,"cashBankTransfer");cbHedefGuncelle()}
function cbHareketEkle(tip,kod,th,is,ac,yon,t){if(tip==="kasa")kasaHareketleri.push({id:cashMoveId++,kasaKod:kod,tarih:th,islem:is,aciklama:ac,yon,tutar:t});else bankaHareketleri.push({id:bankMoveId++,bankaKod:kod,tarih:th,islem:is,aciklama:ac,yon,tutar:t})}
function saveCashBankTransfer(){const f=document.getElementById("cbFrom").value,t=document.getElementById("cbTo").value,a=moneyRead(document.getElementById("cbAmount").value);if(!f){alert("KAYNAK SEÇİN.");return}if(!t){alert("HEDEF SEÇİN.");return}if(f===t){alert("KAYNAK VE HEDEF AYNI OLAMAZ.");return}if(!Number.isFinite(a)||a<=0){alert("GEÇERLİ TUTAR GİRİN.");return}const F=kasaBankaBul(f),T=kasaBankaBul(t);if(!F||!T){alert("HESAP BULUNAMADI.");return}if((Number(F.kayit.bakiye)||0)<a){alert("KAYNAK HESAPTA YETERLİ BAKİYE YOK.");return}const th=dateText(document.getElementById("cbDate").value),ac=document.getElementById("cbNote").value.trim();F.kayit.bakiye-=a;T.kayit.bakiye+=a;cbHareketEkle(F.tip,f,th,"VİRMAN ÇIKIŞ",ac||("→ "+T.ad),"A",a);cbHareketEkle(T.tip,t,th,"VİRMAN GİRİŞ",ac||(F.ad+" →"),"B",a);closeModal();draw()}
function editMove(){const h=hareketler.find(x=>x.id===selectedMove&&x.kod===selectedCari);if(!h){alert("HAREKET SATIRI SEÇİN.");return}const v=prompt("YENİ TUTAR:",String(h.tutar));if(v===null)return;const n=moneyRead(v);if(!Number.isFinite(n)||n<=0){alert("GEÇERLİ TUTAR GİRİN.");return}h.tutar=n;draw()}
function deleteMove(){const h=hareketler.find(x=>x.id===selectedMove&&x.kod===selectedCari);if(!h){alert("SİLMEK İÇİN HAREKET SATIRI SEÇİN.");return}if(!confirm("SEÇİLİ HAREKET SİLİNSİN Mİ?"))return;hareketler=hareketler.filter(x=>x.id!==h.id);selectedMove=null;draw()}
function printCaris(){document.getElementById("printArea").innerHTML=`<h2>CARİ HESAPLAR</h2><table><thead><tr><th>KOD</th><th>ÜNVAN</th><th>TÜR</th><th>BAKİYE</th></tr></thead><tbody>${cariler.map(c=>`<tr><td>${c.kod}</td><td>${c.unvan}</td><td>${c.tip}</td><td>${money(balance(c.kod))}</td></tr>`).join("")}</tbody></table>`;window.print()}
function printStatement(){if(!selectedCari){alert("ÖNCE CARİ SEÇİN.");return}const c=cariler.find(x=>x.kod===selectedCari);document.getElementById("printArea").innerHTML=`<h2>CARİ EKSTRE - ${c.kod} - ${c.unvan}</h2><table><thead><tr><th>TARİH</th><th>İŞLEM</th><th>AÇIKLAMA</th><th>BORÇ</th><th>ALACAK</th></tr></thead><tbody>${hareketler.filter(h=>h.kod===selectedCari).sort((a,b)=>dateOrder(a.tarih)-dateOrder(a.tarih)).map(h=>`<tr><td>${h.tarih}</td><td>${h.islem}</td><td>${h.aciklama||""}</td><td>${h.yon==="B"?money(h.tutar):""}</td><td>${h.yon==="A"?money(h.tutar):""}</td><td>${money(m.get(h.id))}</td></tr>`).join("")}</tbody></table>`;window.print()}
function printSimple(t){document.getElementById("printArea").innerHTML=`<h2>${t}</h2>`;window.print()}
draw();
</script>
</body>
